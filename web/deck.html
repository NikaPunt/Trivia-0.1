<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 290px;
      height: 100vh;
    }
    body.hide-sidebar {
      grid-template-columns: 1fr;
    }
    body.hide-sidebar #sidebar {
      display: none;
    }
    #stage {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5rem 5rem;
      height: 100vh;
    }
    #sidebar {
      border-left: 1px solid var(--border);
      padding: 2.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
    }
    .deck-topbar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .slide-main {
      margin: auto 0;
      max-width: 960px;
    }
    .question-prose {
      font-family: var(--font-serif);
      font-size: 2.15rem;
      line-height: 1.48;
      color: var(--text);
      margin-bottom: 2rem;
    }
    .question-ask {
      font-family: var(--font-sans);
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.3;
    }
    .answer-block {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 2px solid var(--text);
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 1rem;
    }
    .deck-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
  </style>
</head>
<body>

  <main id="stage">
    <header class="deck-topbar">
      <div class="meta-line">
        <span id="event-title">Trivia</span>
        <span id="round-label"></span>
        <span id="theme-top-label" style="margin-left:1rem; color:var(--accent);"></span>
      </div>
      <div class="meta-line" style="display:flex; gap:1.5rem; align-items:baseline;">
        <span id="timer-display" style="display:none; color:var(--accent); font-size:1.1rem;">45s</span>
        <span id="phase-label">Lobby</span>
      </div>
    </header>

    <section id="slide-content" class="slide-main"></section>

    <footer class="deck-footer">
      <div>
        Join on Wi-Fi: <strong id="footer-join-url" style="color:var(--text);">http://localhost:8080</strong>
      </div>
      <div style="display:flex; gap:1.25rem;">
        <span>Space / → : Next</span>
        <span>← : Back</span>
        <span>L : Standings</span>
        <span>S : Sidebar</span>
      </div>
    </footer>
  </main>

  <aside id="sidebar">
    <div>
      <div class="meta-line" style="display:flex; justify-content:space-between; margin-bottom:1rem;">
        <span>Teams</span>
        <span id="submission-counter">0 / 0</span>
      </div>
      <div id="sidebar-teams"></div>
    </div>

    <div class="meta-line" style="line-height:1.6;">
      Connect on phone<br />
      <strong id="sidebar-join-url" style="font-size:1rem; text-transform:none; letter-spacing:0;"></strong>
    </div>
  </aside>

  <script src="/app.js"></script>
  <script>
    let lastRenderKey = '';

    async function fetchDeckState(force = false) {
      try {
        const res = await fetch('/api/state?_t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();

        document.getElementById('footer-join-url').textContent = data.joinUrl;
        document.getElementById('sidebar-join-url').textContent = data.joinUrl;
        document.getElementById('event-title').textContent = data.event.title || 'Trivia';
        document.getElementById('phase-label').textContent = data.state.phase.replace('_', ' ');
        document.getElementById('round-label').textContent = data.round ? ` — ${data.round.title}` : '';
        document.getElementById('theme-top-label').textContent = (data.event && data.event.themeRevealed && data.event.formalTheme)
          ? `Theme: ${data.event.formalTheme}`
          : 'Round 1 Secret Theme Open';

        renderSidebar(data);
        updateTimer(data);

        const key = JSON.stringify({
          phase: data.state.phase,
          r: data.state.roundIndex,
          q: data.state.questionIndex,
          clue: data.state.clueStep,
          themeRev: data.event ? data.event.themeRevealed : false,
          teamsLen: asArray(data.leaderboard).length,
          ans: data.question ? data.question.answer : null
        });

        if (force || key !== lastRenderKey) {
          lastRenderKey = key;
          renderSlide(data);
        }
      } catch (e) {}
    }

    function updateTimer(data) {
      const el = document.getElementById('timer-display');
      const endMs = data.state.timerEndUtcMs || 0;
      if (!endMs || data.state.phase !== 'QUESTION_OPEN') {
        el.style.display = 'none';
        return;
      }
      const remaining = Math.max(0, Math.ceil((endMs - Date.now()) / 1000));
      el.style.display = 'inline';
      el.textContent = `${remaining}s`;
    }

    function renderSidebar(data) {
      const teams = asArray(data.leaderboard);
      const inCount = teams.filter(t => t.submittedCurrent).length;
      document.getElementById('submission-counter').textContent = `${inCount}/${teams.length} In`;

      const container = document.getElementById('sidebar-teams');
      if (teams.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">No teams connected yet.</p>`;
        return;
      }

      container.innerHTML = teams.map(t => {
        let marker = '';
        if (data.state.phase === 'ANSWER_REVEALED') {
          marker = t.currentGrade === 'correct' ? '✓ ' : (t.currentGrade === 'half' ? '½ ' : '✗ ');
        } else if (t.submittedCurrent) {
          marker = '• ';
        }
        const themeStar = t.themeSolved ? ' ★' : '';
        const nameColor = t.submittedCurrent ? 'var(--text)' : 'var(--text-muted)';
        return `
          <div class="team-row">
            <span style="color:${nameColor}; font-weight:${t.submittedCurrent ? '600' : '400'};">${marker}${escapeHtml(t.name)}${themeStar}</span>
            <span style="font-variant-numeric:tabular-nums; font-weight:600;">${t.score}</span>
          </div>
        `;
      }).join('');
    }

    function renderSlide(data) {
      const stage = document.getElementById('slide-content');
      const phase = data.state.phase;
      const ev = data.event || {};
      const r = data.round || {};
      const q = data.question;

      if (phase === 'LOBBY') {
        const rulesHtml = asArray(ev.rules).map(rule => `
          <li style="margin-bottom:0.65rem; font-size:1.3rem; color:var(--text-muted);">${escapeHtml(rule)}</li>
        `).join('');
        stage.innerHTML = `
          <div>
            <div class="meta-line" style="margin-bottom:1rem;">${escapeHtml(ev.date || '')}</div>
            <h1 style="font-family:var(--font-serif); font-size:4.25rem; font-weight:400; line-height:1.1; margin-bottom:0.75rem;">
              ${escapeHtml(ev.title || 'Trivia Night')}
            </h1>
            <p style="font-size:1.5rem; color:var(--text-muted); margin-bottom:2.5rem;">${escapeHtml(ev.subtitle || '')}</p>
            <ul style="padding-left:1.25rem; margin-bottom:3rem;">${rulesHtml}</ul>
            <div style="font-size:1.5rem;">
              Connect on your phone: <strong style="color:var(--accent);">${escapeHtml(data.joinUrl)}</strong>
            </div>
          </div>
        `;
        return;
      }

      if (phase === 'ROUND_INTRO') {
        stage.innerHTML = `
          <div>
            <div class="meta-line" style="margin-bottom:1rem;">Round ${r.roundNumber} of ${r.totalRounds}</div>
            <h1 style="font-family:var(--font-serif); font-size:3.75rem; font-weight:400; margin-bottom:1rem;">
              ${escapeHtml(r.title)}
            </h1>
            <p style="font-size:1.5rem; color:var(--text-muted); max-width:760px;">${escapeHtml(r.subtitle || '')}</p>
            ${ev.themeRevealed && ev.formalTheme ? `
              <div style="margin-top:2.5rem; padding-top:1.5rem; border-top:1px solid var(--border);">
                <div class="meta-line" style="margin-bottom:0.35rem;">Tonight's Theme</div>
                <div style="font-family:var(--font-serif); font-size:2.2rem; color:var(--accent);">${escapeHtml(ev.formalTheme)}</div>
              </div>
            ` : ''}
          </div>
        `;
        return;
      }

      if (phase === 'SECTION_INTRO' && q) {
        const poolCats = asArray(q.poolCategories);
        const poolVals = asArray(q.poolValues).length > 0 ? asArray(q.poolValues) : [8, 6, 4, 2];
        const poolHtml = poolCats.length > 0 ? `
          <div style="margin-top:2.5rem; padding-top:1.5rem; border-top:1px solid var(--border);">
            <div class="meta-line" style="margin-bottom:0.85rem;">The Four Categories (${poolVals.join(', ')} pts)</div>
            <div style="font-family:var(--font-serif); font-size:2.2rem; color:var(--accent);">
              ${poolCats.map(c => escapeHtml(c)).join(' &nbsp;·&nbsp; ')}
            </div>
          </div>
        ` : '';

        stage.innerHTML = `
          <div>
            <div class="meta-line" style="margin-bottom:1rem;">Round ${r.roundNumber} &nbsp;·&nbsp; Category Intro</div>
            <h1 style="font-family:var(--font-serif); font-size:4rem; font-weight:400; margin-bottom:1.25rem;">
              ${escapeHtml(q.sectionIntroTitle || q.sectionTitle || q.category)}
            </h1>
            <p style="font-size:1.65rem; line-height:1.5; color:var(--text-muted); max-width:820px;">
              ${escapeHtml(q.sectionIntroDesc || '')}
            </p>
            ${poolHtml}
          </div>
        `;
        return;
      }

      if (phase === 'LEADERBOARD') {
        const rows = asArray(data.leaderboard).map((t, idx) => `
          <div style="display:flex; justify-content:space-between; align-items:baseline; padding:0.9rem 0; border-bottom:1px solid var(--border); font-size:1.65rem;">
            <div>
              <span style="color:var(--text-muted); display:inline-block; width:2.5rem;">${idx + 1}.</span>
              <span style="font-weight:600;">${escapeHtml(t.name)}</span>
              ${t.themeSolved ? `<span style="font-size:0.95rem; color:var(--accent); margin-left:0.75rem;">★ Theme Solved</span>` : ''}
            </div>
            <div style="font-variant-numeric:tabular-nums; font-weight:700; color:${idx === 0 ? 'var(--accent)' : 'var(--text)'};">
              ${t.score} pts
            </div>
          </div>
        `).join('');

        stage.innerHTML = `
          <div>
            <div class="meta-line" style="margin-bottom:0.75rem;">Standings</div>
            <h1 style="font-family:var(--font-serif); font-size:3rem; font-weight:400; margin-bottom:1.5rem;">Leaderboard</h1>
            ${ev.themeRevealed && ev.formalTheme ? `
              <div style="margin-bottom:2rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border);">
                <div class="meta-line">Tonight's Secret Theme Revealed</div>
                <div style="font-family:var(--font-serif); font-size:2rem; color:var(--accent); margin-top:0.25rem;">${escapeHtml(ev.formalTheme)}</div>
              </div>
            ` : ''}
            <div>${rows || '<p style="font-size:1.35rem; color:var(--text-muted);">No scores recorded yet.</p>'}</div>
          </div>
        `;
        return;
      }

      if (!q) return;

      const solvedTeams = asArray(data.leaderboard).filter(t => t.currentGrade === 'correct').map(t => {
        return t.currentWager ? `${t.name} (+${t.currentWager})` : t.name;
      });

      const mechanic = q.mechanic || 'standard';
      const poolCats = asArray(q.poolCategories);
      const poolVals = asArray(q.poolValues).length > 0 ? asArray(q.poolValues) : [8, 6, 4, 2];

      let subHeaderHtml = '';
      if (mechanic === 'confidence' && poolCats.length > 0) {
        subHeaderHtml = `
          <div class="meta-line" style="margin-bottom:1.25rem; color:var(--text-muted);">
            Confidence Pool (${poolVals.join(' / ')} pts): &nbsp; ${poolCats.map(c => c === q.category ? `<strong style="color:var(--text);">${escapeHtml(c)}</strong>` : escapeHtml(c)).join(' &nbsp;·&nbsp; ')}
          </div>
        `;
      } else if (mechanic === 'jeopardy') {
        subHeaderHtml = `
          <div class="meta-line" style="margin-bottom:1.25rem; color:var(--accent);">
            Jeopardy Final Wager (0 to ${q.points || 20} pts — +Wager if Correct, -Wager if Wrong)
          </div>
        `;
      }

      stage.innerHTML = `
        <div>
          <div class="meta-line" style="margin-bottom:0.65rem;">
            Question ${q.number} of ${q.totalInRound} &nbsp;·&nbsp; ${escapeHtml(q.sectionTitle || q.category)} &nbsp;·&nbsp; <strong>Answer Type: ${escapeHtml(q.answerType)}</strong>
          </div>
          ${subHeaderHtml}

          ${q.jeopardyWagerPhase ? `
            <div class="question-prose" style="color:var(--text);">
              Category: <strong>${escapeHtml(q.category)}</strong>
            </div>
          ` : `
            <div class="question-prose">
              ${buildQuestionParagraph(q, false)}
            </div>
          `}

          <div class="question-ask">
            ${escapeHtml(q.questionPrompt)}
          </div>

          ${phase === 'SUBMISSIONS_LOCKED' ? `
            <div class="meta-line" style="margin-top:2rem; color:var(--accent);">
              Submissions Closed
            </div>
          ` : ''}

          ${phase === 'ANSWER_REVEALED' ? `
            <div class="answer-block">
              <div class="meta-line" style="margin-bottom:0.35rem;">Answer</div>
              <div style="font-family:var(--font-serif); font-size:3rem; color:var(--text); line-height:1.15;">
                ${escapeHtml(q.answer)}
              </div>
              ${q.funFact ? `<p style="margin-top:0.75rem; font-size:1.15rem; color:var(--text-muted); max-width:820px;">${escapeHtml(q.funFact)}</p>` : ''}
              <div class="meta-line" style="margin-top:1rem;">
                ${solvedTeams.length > 0 ? `Correct: ${escapeHtml(solvedTeams.join(', '))}` : 'No teams solved this question'}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    window.addEventListener('keydown', async (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space' || e.code === 'ArrowRight') {
        e.preventDefault();
        await postJson('/api/host/action', { action: 'next_step' });
        fetchDeckState(true);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        await postJson('/api/host/action', { action: 'prev_step' });
        fetchDeckState(true);
      } else if (e.key === 'l' || e.key === 'L') {
        await postJson('/api/host/action', { action: 'set_phase', phase: 'LEADERBOARD' });
        fetchDeckState(true);
      } else if (e.key === 's' || e.key === 'S') {
        document.body.classList.toggle('hide-sidebar');
      }
    });

    fetchDeckState(true);
    setInterval(() => fetchDeckState(false), 1000);
  </script>
</body>
</html>
